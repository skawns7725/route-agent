<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122625">
  <title>가는 길에 — 지도</title>
  <link rel="stylesheet" href="/map.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="workspace" aria-label="가는 길에 지도">
    <div id="atlasMap" class="map-layer" aria-label="카카오 지도" hidden></div>
    <canvas id="exampleMap" class="map-layer" role="img" aria-label="대전 예시 지도"></canvas>
    <aside id="rail" class="rail" aria-label="도구">
      <div class="rail-brand"><span class="brand-mark" aria-hidden="true">➤</span><span class="rail-name">가는 길에</span></div>
      <button id="railToggle" class="rail-toggle" type="button" aria-expanded="false" aria-label="사이드바 펼치기" title="사이드바 펼치기"><span aria-hidden="true">☰</span><span class="rail-name">접기</span></button>
      <nav aria-label="지도 도구">
        <button type="button" data-panel="route" aria-controls="routePanel" aria-expanded="false" title="경로"><span class="rail-icon" aria-hidden="true">↗</span><span class="rail-name">경로</span></button>
        <button type="button" data-panel="signals" aria-controls="signalsPanel" aria-expanded="false" title="실제 신호"><span class="rail-icon icon-signal" aria-hidden="true"><i></i></span><span class="rail-name">실제 신호</span></button>
        <button type="button" data-panel="simulation" aria-controls="simulationPanel" aria-expanded="false" title="모의 주행"><span class="rail-icon icon-play" aria-hidden="true">▷</span><span class="rail-name">모의 주행</span></button>
        <button type="button" data-panel="voice" aria-controls="voicePanel" aria-expanded="false" title="음성 안내"><span class="rail-icon icon-voice" aria-hidden="true"><i></i></span><span class="rail-name">음성 안내</span></button>
      </nav>
    </aside>

    <header class="map-header">
      <div class="map-legend">
        <span class="legend-dot" aria-hidden="true"></span>
        <div><span id="mapMode">예시 지도</span><small id="tileState" role="status">지도 연결 확인 중</small></div>
      </div>
      <button id="mapSwitch" class="map-action" type="button" hidden>카카오 지도</button>
      <button id="gpsButton" class="map-action gps" type="button"><span aria-hidden="true">⌖</span> <span>GPS 시작</span></button>
    </header>
    <div class="map-zoom" aria-label="지도 크기">
      <button id="zoomIn" type="button" aria-label="확대">+</button>
      <button id="zoomOut" type="button" aria-label="축소">−</button>
    </div>
    <div id="mapCredit" class="map-credit">예시 지도 · 개략도</div>

    <aside id="toolPanel" class="tool-panel" aria-label="선택한 지도 도구" hidden>
      <button id="closePanel" class="close-panel" type="button" aria-label="패널 닫기">×</button>
      <section id="routePanel" data-view="route" aria-labelledby="routeTitle" hidden>
        <div class="panel-heading"><span class="panel-icon" aria-hidden="true">↗</span><div><h1 id="routeTitle" tabindex="-1">자동차 경로</h1><p>출발지와 도착지를 선택하세요.</p></div></div>
        <div id="routeContent"></div>
      </section>
      <section id="signalsPanel" data-view="signals" aria-labelledby="signalTitle" hidden>
        <div class="panel-heading"><span class="panel-icon actual" aria-hidden="true">●</span><div><h1 id="signalTitle" tabindex="-1">실제 신호 관찰</h1><p>공공데이터포털 조회</p></div></div>
        <div class="field-grid">
          <label class="field">지역 <select id="signalRegion"></select></label>
          <label class="field" id="signalDistrictRow">자치구 <select id="signalDistrict"><option>유성구</option><option>대덕구</option><option>동구</option><option>서구</option><option>중구</option></select></label>
          <label class="field" id="facilityFilterRow">신호등 검색 <input id="facilityFilter" placeholder="주소, 도로명, 관리번호" autocomplete="off"></label>
          <label class="field"><span id="signalCrossingLabel">신호등</span> <select id="signalCrossing" disabled></select></label>
        </div>
        <div class="inline-actions">
          <button id="refreshSignal" class="secondary" type="button" disabled>다시 조회</button>
          <button id="showSignalMap" class="secondary" type="button" hidden>지도에서 보기</button>
        </div>
        <p id="signalStatus" class="status" role="status"></p>
        <div id="signalRows"></div>
        <p class="source"><span id="signalSourceNote"></span> <a id="signalSource" target="_blank" rel="noopener noreferrer">원본 데이터</a></p>
      </section>
      <section id="simulationPanel" data-view="simulation" aria-labelledby="simulationTitle" hidden>
        <div class="panel-heading"><span class="panel-icon simulated" aria-hidden="true">▷</span><div><h1 id="simulationTitle" tabindex="-1">주행 시뮬레이션</h1><p>가상 차량 · 테스트 신호</p></div></div>
        <div id="simulationContent"></div>
      </section>
      <section id="voicePanel" data-view="voice" aria-labelledby="voiceTitle" hidden>
        <div class="panel-heading"><span class="panel-icon voice" aria-hidden="true">◉</span><div><h1 id="voiceTitle" tabindex="-1">음성 안내</h1><p>경로 요약을 듣거나 모의 주행을 시작하세요.</p></div></div>
        <button id="readRoute" class="primary" type="button">선택한 경로 읽기</button>
        <button id="mic" class="secondary" type="button" aria-pressed="false">마이크로 말하기</button>
        <form id="voiceForm" class="voice-form">
          <label class="field">텍스트 명령 <input id="voiceInput" placeholder="예: 경로 읽어 줘" autocomplete="off"></label>
          <button class="secondary" type="submit">보내기</button>
        </form>
        <p id="voiceStatus" class="status" role="status"></p>
      </section>
    </aside>

    <section id="playback" class="playback" aria-label="모의 주행 재생" hidden></section>
    <button id="sampleShortcut" class="sample-shortcut" type="button"><span aria-hidden="true">▶</span> 예시 주행</button>
  </main>
</body>
</html>
