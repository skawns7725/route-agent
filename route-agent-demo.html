ref="https://map.kakao.com/link/map/충남대,36.363,127.344" target="_blank" rel="noopener">카카오맵에서 열기 ↗</a> <fieldset id="tripFields" disabled><legend>자동차 길찾기</legend><div id="tripPlaces"></div><button id="tripVia" type="button" aria-expanded="false">경유지 추가</button><label><input id="avoidTolls" type="checkbox"> 유료도로 피하기</label><button id="tripSwap" type="button">출발·도착 바꾸기</button></fieldset><div id="tripResults" aria-label="경로 후보"></div><details id="tripDetails" hidden><summary>경로 상세</summary><ol id="tripSteps"></ol></details><button id="roadRoute">실제 도로 경로 조회</button><p id="roadResult" aria-live="polite"></p><div id="atlasMap" style="height:0"></div><small id="tileState">내장 위치도 · 상세 도로지도 연결 중…</small><label><input id="flow" type="checkbox" disabled> 교통상황</label><details open><summary>카카오 지도 연결</summary><label>JavaScript 키 <input id="mapKey" autocomplete="off"></label><button id="connectMap">지도 연결</button></details></section><section><b>모의 경로 · 용운동 → 충남대</b><p id="routes"></p><strong id="status"></strong></section><section><small>음성 안내</small><p id="reply" aria-live="polite">“충남대 가자”라고 말해 주세요.</p><button id="mic">음성 시작</button><span id="feedback"></span><form><input aria-label="요청" placeholder="거기 리뷰는? 아까 얘기한 곳 중 싼 곳은?"><button>보내기</button></form><div id="examples"></div></section><button id="traffic">모의 정체 전환</button><button id="pass">추천 매장 진입로 통과</button><p><small>시간·교차로·리뷰·가격·주차 정보는 데모용 예시입니다.</small></p></main><script>
const el=id=>document.getElementById(id);
const shops={맥도날드:[8,'유턴이 필요하고 드라이브스루가 있어요.','가격과 리뷰는 미확인이에요.'],버거집A:[3,'오른쪽으로 진입하고 주차장이 있어요.','세트 8천 원대, 방문자 리뷰 320개, 별점 4.3점(5점 만점)이에요.'],편의점:[2,'같은 방향으로 복귀하고 주차장이 있어요.','5천 원 이내 식사 조합이 있어요. 리뷰는 미확인이에요.']};
const discussed=new Set(); let focus='',food='';

let route='',pending='',stop='',proposal='',jam=false,passed=new Set(),voice=false;
function fastest(){return jam?'큰길':'도심길'}
function render(){el('via').textContent=stop||route||'직행';el('routes').textContent='도심길 '+(jam?33:24)+'분 · 신호 교차로 12곳　/　큰길 26분 · 5곳';el('status').textContent=route?route+' 안내 중'+(stop?' · '+stop+' 경유':' · 직행'):'경로 선택 전'}
function say(s){el('reply').textContent=s;if(voice&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';speechSynthesis.speak(u)}render()}
const branches=['맥도날드 A점','맥도날드 B점'];
shops[branches[0]]=[4,'진행 방향에서 진입해요.',''];shops[branches[1]]=shops.맥도날드;
for(const b of branches)details[b]={...details.맥도날드,review:b===branches[0]?'세트는 9천 원이고 진행 방향에서 진입해요. 주차장 크기와 리뷰는 미확인이에요.':details.맥도날드.review};

function handle(q){q=q.trim();if(!q)return;
if(/취소|그냥 학교|직행/.test(q)){pending=stop=proposal='';return say('경유 요청을 취소했어요.')}
if(/^(응|그래|좋아|거기로|확정)/.test(q)){if(pending){stop=pending;focus=stop;pending='';return say(stop+' 경유를 적용했어요.')}if(proposal){route=proposal;proposal='';return say(route+'로 안내할게요.')}return say('현재 확인할 제안이 없어요.')}
const other=/다른\s*(데|곳|지점)/.test(q);
const openBrand=/고민|애매|망설|다른\s*(버거|햄버거|브랜드|가게)|버거면/.test(q);
const mc=/맥날|맥도날드|감튀/.test(q);

 if(!route)return say('먼저 충남대까지 갈 경로를 정해 주세요.');

 pending=focus=choice;proposal='';food='버거';discussed.add(choice);

 const base=route==='큰길'?26:jam?33:24;
 for(const b of available)discussed.add(b);
 return say(available.map(b=>b+'을 거치면 충남대까지 '+(base+shops[b][0])+'분').join(', ')+'. '+choice+'으로 갈까요?');

}

 if(named&&!broad&&!prior)pool=[named];
 if(!prior&&!broad&&food==='버거'&&!named)pool=pool.filter(n=>n!=='편의점');
 pool=pool.filter(n=>!passed.has(n)).sort((x,y)=>details[x].price-details[y].price);

 name=pool[0];reason=(pool.length>1?pool.join('·')+' 중에서는 ':'지금 비교 범위에서는 ')+name+'이 '+details[name].price.toLocaleString('ko-KR')+'원이에요. ';
 }else if(named==='편의점'){food='편의점';name=named}
 else{food='버거';name=/감튀|맥날 꼭/.test(q)?'맥도날드':'버거집A';if(named==='맥도날드'&&name!==named){discussed.add(named);reason='맥날은 유턴해야 하고 8분 더 걸려요. '}}
 pending=proposal='';if(passed.has(name))return say('그 매장 진입로는 지났어요.');
 discussed.add(name);focus=pending=name;
 return say(reason+name+'은 '+shops[name][0]+'분 추가예요. '+shops[name][1]+' 들를까요?');
}
if(/충남대|신호|빨리|빠른|큰길/.test(q)){pending='';proposal=/신호|큰길/.test(q)?'큰길':fastest();return say(proposal+'을 추천해요. '+el('routes').textContent+'예요. 이 길로 갈까요?')}
say('빠른 길, 신호 적은 길, 또는 들르고 싶은 곳을 말해 주세요.')}
document.querySelector('form').onsubmit=e=>{e.preventDefault();let i=document.querySelector('form input');handle(i.value);i.value=''};
for(const s of ['충남대 가자','신호 적은 길','응','맥날 가자','다른 데는?','고민되네','거기 리뷰는?','싼 곳으로','그냥 학교 가자']){let b=document.createElement('button');b.textContent=s;b.onclick=()=>handle(s);el('examples').append(b)}
el('traffic').onclick=()=>{jam=!jam;pending=proposal='';render();say('교통이 바뀌었어요. 지금 가장 빠른 길은 '+fastest()+'이에요. 빠른 길로 바꿀까요?');proposal=fastest()};
el('pass').onclick=()=>{if(pending){passed.add(pending);pending='';say('진입로를 지나 이전 추천을 취소했어요.')}else say('현재 추천 중인 매장이 없어요.')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
el('mic').onclick=()=>{if(!SR)return say('이 브라우저에서는 버튼이나 입력창으로 시험해 주세요.');if(voice){voice=false;window.rec.stop();window.speechSynthesis?.cancel();el('mic').textContent='음성 시작';return}let rec=new SR();window.rec=rec;rec.lang='ko-KR';rec.continuous=true;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal&&!window.speechSynthesis?.speaking)handle(e.results[i][0].transcript)};rec.onerror=e=>{voice=false;el('feedback').textContent='음성 인식 중단 · '+e.error};rec.onend=()=>{if(voice){try{rec.start();return}catch{voice=false}}el('mic').textContent='음성 시작'};try{rec.start();voice=true;el('mic').textContent='음성 종료'}catch{say('마이크를 시작할 수 없어요.')}};render()
</script><script>
const mapStatus=el('tileState'),connect=el('connectMap');
el('roadRoute').disabled=true;

connect.onclick=()=>{
 if(!/^https?:$/.test(location.protocol)){mapStatus.textContent='웹 서버로 열어 주세요. 예: http://localhost:8080/route-agent-demo.html';return}
 const key=el('mapKey').value.trim();if(!key){mapStatus.textContent='앱의 JavaScript 키를 입력해 주세요.';return}
 connect.disabled=true;mapStatus.textContent='카카오 지도 연결 중…';
 const sdk=document.createElement('script');let active=true;
 function fail(){if(!active)return;active=false;clearTimeout(timeout);connect.disabled=false;sdk.remove();mapStatus.textContent='연결 실패 · JavaScript 키, 등록 도메인, 카카오맵 사용 설정을 확인하세요.'}
 const timeout=setTimeout(fail,15000);
 sdk.onerror=fail;sdk.onload=()=>{if(!window.kakao?.maps)return fail();kakao.maps.load(()=>{if(!active)return;try{
 const k=kakao.maps,canvas=el('atlasMap');canvas.style.height='350px';
 const map=new k.Map(canvas,{center:new k.LatLng(36.4,127.8),level:13});
 map.addControl(new k.ZoomControl(),k.ControlPosition.RIGHT);
 const theme=el('theme');theme.onchange=()=>map.setMapTypeId(k.MapTypeId[theme.value]);theme.onchange();

const fields=el('tripFields'), report=el('roadResult'), search=el('roadRoute'), list=el('tripResults');
 const places=new k.services.Places(), geocoder=new k.services.Geocoder(), slots={};let revision=0,lines=[],markers=[];const details=el('tripDetails'),steps=el('tripSteps');

 }

 }
 function invalidate(){revision++;search.disabled=false;list.replaceChildren();details.hidden=true;details.open=false;steps.replaceChildren();for(const marker of markers)marker.setMap(null);markers=[];for(const line of lines)line.setMap(null);lines=[];report.textContent='장소를 확정한 뒤 경로를 조회하세요.'}
 for(const [id,label] of [['start','출발지'],['via','경유지 (선택)'],['end','도착지']]){

 for(const place of data.slice(0,5)){const b=document.createElement('button');b.type='button';b.textContent=place.place_name+' · '+(place.road_address_name||place.address_name);b.onclick=()=>setPlace(slot,place);results.append(b)}
 }),300)};
 }
 slots.via.row.hidden=true;
 const viaToggle=el('tripVia');
 viaToggle.onclick=()=>{
 const slot=slots.via;const opening=slot.row.hidden;

 slot.query++;clearTimeout(slot.timer);slot.value=null;slot.input.value='';slot.results.replaceChildren();invalidate();
 };
 el('tripSwap').onclick=()=>{const a=slots.start,b=slots.end;[a.value,b.value]=[b.value,a.value];[a.input.value,b.input.value]=[b.input.value,a.input.value];for(const slot of [a,b]){slot.query++;clearTimeout(slot.timer);slot.results.replaceChildren()}invalidate()};
 const tools=document.createElement('section');

 function showPlace(place,zoom){
 selected=place;
 const position=new k.LatLng(Number(place.y),Number(place.x));
 pin.setPosition(position);pin.setMap(map);
 if(zoom){map.setLevel(4);map.panTo(position)}
 const address=place.road_address_name||place.address_name;
 card.querySelector('strong').textContent=address&&address!==place.place_name?place.place_name+' · '+address:place.place_name;
 const link=card.querySelector('a');
 link.hidden=!/^https?:\/\/place\.map\.kakao\.com\/\d+/.test(place.place_url||'');
 if(!link.hidden)link.href=place.place_url;
 card.hidden=false;
 }
 for(const button of card.querySelectorAll('[data-slot]'))button.onclick=()=>{
 const id=button.dataset.slot;
 if(id==='via'&&slots.via.row.hidden)viaToggle.click();
 setPlace(slots[id],selected);
 };
 query.oninput=()=>{queryVersion++;results.replaceChildren();message.textContent=''};
 form.onsubmit=event=>{
 event.preventDefault();
 const keyword=query.value.trim(),token=++queryVersion;
 results.replaceChildren();
 if(!keyword){message.textContent='장소 이름이나 주소를 입력하세요.';return}
 message.textContent='장소 검색 중…';
 lookup(keyword,(data,status)=>{
 if(token!==queryVersion)return;
 message.textContent=status===k.services.Status.OK?'':status===k.services.Status.ZERO_RESULT?'검색 결과가 없어요.':'장소 검색에 실패했어요.';
 for(const place of data){
 const button=document.createElement('button');button.type='button';
 button.textContent=place.place_name+(place.address_name&&place.address_name!==place.place_name?' · '+place.address_name:'');
 button.onclick=()=>showPlace(place,true);results.append(button);
 }
 });
 };
 k.event.addListener(map,'click',event=>{
 const x=event.latLng.getLng(),y=event.latLng.getLat();
 const point={x,y,place_name:y.toFixed(5)+', '+x.toFixed(5)};
 showPlace(point,false);
 geocoder.coord2Address(x,y,(data,status)=>{
 if(selected!==point||status!==k.services.Status.OK)return;
 const address=data[0]?.road_address?.address_name||data[0]?.address?.address_name;
 if(address)showPlace({...point,place_name:address},false);
 });
 });
 tools.querySelector('[data-locate]').onclick=()=>{
 if(!navigator.geolocation){message.textContent='현재 위치를 지원하지 않는 환경이에요.';return}
 message.textContent='현재 위치 확인 중…';
 navigator.geolocation.getCurrentPosition(({coords})=>{
 message.textContent='';showPlace({x:coords.longitude,y:coords.latitude,place_name:'현재 위치'},true);
 },()=>{message.textContent='현재 위치를 확인하지 못했어요. 위치 권한을 확인해 주세요.'},{timeout:10000});
 };
 el('avoidTolls').onchange=invalidate; fields.disabled=false;search.disabled=false;
 search.onclick=async()=>{
 if(!slots.start.value||!slots.end.value||slots.via.input.value.trim()&&!slots.via.value){report.textContent='검색 결과에서 출발지·도착지와 입력한 경유지를 선택하세요.';return}
 const trip=[slots.start.value,slots.via.value,slots.end.value].filter(Boolean);
 if(new Set(trip.map(p=>p.x+','+p.y)).size!==trip.length){report.textContent='서로 다른 장소를 선택하세요.';return}
 const token=++revision;search.disabled=true;report.textContent='자동차 경로 조회 중…';
 try{
 const point=p=>Number(p.x)+','+Number(p.y);
 const params=new URLSearchParams({origin:point(trip[0]),destination:point(trip[trip.length-1]),avoidTolls:String(el('avoidTolls').checked)});
 if(trip.length===3)params.set('via',point(trip[1]));
 const response=await fetch('/api/routes?'+params,{signal:AbortSignal.timeout(12000)});
 const data=await response.json();if(token!==revision)return;
 if(!response.ok)throw Error(data.error||'경로 조회에 실패했어요.');
 const paths=data.routes.map(r=>r.sections.flatMap(section=>(section.roads||[]).flatMap(road=>{
 const pairs=[];for(let i=0;i+1<road.vertexes.length;i+=2)pairs.push(new k.LatLng(road.vertexes[i+1],road.vertexes[i]));return pairs;
 })));
 for(const line of lines)line.setMap(null);for(const marker of markers)marker.setMap(null);
 markers=trip.map(p=>new k.Marker({map,position:new k.LatLng(Number(p.y),Number(p.x)),title:p.place_name}));
 lines=paths.map(path=>new k.Polyline({map,path,strokeWeight:5,strokeColor:'#9aa9bd'}));list.replaceChildren();
  function select(i){
 steps.replaceChildren();
 for(const leg of data.routes[i].sections||[])for(const step of leg.roads||[]){
 if(step.distance<1)continue;
 const item=document.createElement('li');
 item.textContent=(step.name||'도로명 미제공')+' · '+Math.round(step.distance).toLocaleString('ko-KR')+'m'+(step.traffic_speed>0?' · 교통 평균 '+Math.round(step.traffic_speed)+'km/h':' · 교통 속도 미제공');
 steps.append(item)
 }
 if(!steps.childElementCount){const item=document.createElement('li');item.textContent='표시할 상세 구간이 없어요.';steps.append(item)}
 details.hidden=false;
 lines.forEach((line,j)=>{line.setOptions({strokeColor:i===j?'#285ddd':'#9aa9bd',strokeWeight:i===j?7:4});line.setZIndex(i===j?2:1)});Array.from(list.children).forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const bounds=new k.LatLngBounds();paths[i].forEach(p=>bounds.extend(p));map.setBounds(bounds)}
 data.routes.forEach((r,i)=>{const b=document.createElement('button');b.textContent='경로 '+(i+1)+' · '+Math.round(r.summary.duration/60)+'분 · '+(r.summary.distance/1000).toFixed(1)+'km · '+(Number.isFinite(r.summary.fare?.toll)?'통행료 '+r.summary.fare.toll.toLocaleString('ko-KR')+'원':'통행료 미제공');b.onclick=()=>select(i);list.append(b)});
 select(0);report.textContent='카카오모빌리티 · 교통 반영 조회 '+new Date(data.fetchedAt).toLocaleTimeString('ko-KR');
 }catch(error){if(token===revision)report.textContent=error.message||'경로 조회에 실패했어요. 다시 시도해 주세요.'}finally{if(token===revision)search.disabled=false}
 };
  clearTimeout(timeout);active=false;el('backupMap').hidden=true;mapStatus.textContent='카카오 지도 · 국내 장소와 자동차 길찾기';el('mapKey').value='';connect.closest('details').open=false
 }catch{fail()}})};
 sdk.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(key);document.head.append(sdk)
};
if(/^https?:$/.test(location.protocol)){
 fetch('/api/map-config',{signal:AbortSignal.timeout(5000)})
 .then(response=>response.ok?response.json():null)
 .then(config=>{
 if(!config?.javascriptKey||connect.disabled||el('mapKey').value.trim())return;
 el('mapKey').value=config.javascriptKey;
 connect.click();
 })
 .catch(()=>{});
}
</script></html>
